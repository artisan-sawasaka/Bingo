<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ビンゴ">
<meta name="theme-color" content="#0d1222">
<title>ビンゴ リモコン</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app" data-conn="connecting" data-phase="setup" data-lever="idle" data-screen="main">
  <section class="side">
    <header class="topbar">
      <span id="connPill" class="pill" role="status" aria-live="polite">接続中…</span>
      <span id="counts" class="counts">— / —</span>
      <button id="fsBtn" class="icon-btn fs-btn" type="button" aria-pressed="false" aria-label="全画面表示">
        <svg class="fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
        <svg class="fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
        <span id="fsLabel">全画面</span>
      </button>
      <button id="soundBtn" class="icon-btn" type="button" aria-pressed="true" aria-label="操作音">♪</button>
    </header>

    <section class="info" aria-live="polite">
      <div class="info-label">前回の番号</div>
      <div id="lastNumber" class="last-number">—</div>
      <div id="recent" class="recent"></div>
    </section>

    <nav class="controls" aria-label="テレビの画面">
      <button id="historyBtn" class="ctl-btn" type="button">
        <span class="ctl-icon">▦</span><span id="historyLabel">番号一覧を表示</span>
      </button>
      <button id="setupBtn" class="ctl-btn" type="button">
        <span class="ctl-icon">⟲</span><span>最大数・リセット</span>
      </button>
    </nav>

    <div id="message" class="message" aria-live="assertive"></div>
  </section>

  <main class="lever-area">
    <div id="lever" class="lever" aria-label="レバー（下に引いて離すと抽選）" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="slot"></div>
      <div id="fill" class="fill"></div>
      <div class="mark mark-threshold"></div>
      <div id="knob" class="knob"><span class="knob-grip"></span></div>
    </div>
    <div id="leverHint" class="lever-hint">レバーを下まで引いて離す</div>
  </main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <h2 id="sheetTitle" class="sheet-title">最大番号の設定</h2>
      <p id="sheetInfo" class="sheet-info"></p>
      <div id="stepEdit" class="edit-grid">
        <div class="edit-left">
          <div class="max-row">
            <button class="step-btn" type="button" data-step="-1" aria-label="1減らす">−</button>
            <!-- readonly: digits come from the on-screen keypad (no system keyboard covering the sheet) -->
            <input id="maxInput" class="max-input" type="text" inputmode="none" readonly tabindex="-1" autocomplete="off" aria-label="最大番号">
            <button class="step-btn" type="button" data-step="1" aria-label="1増やす">＋</button>
          </div>
          <div class="presets">
            <button type="button" class="preset" data-v="75">75</button>
            <button type="button" class="preset" data-v="90">90</button>
            <button type="button" class="preset" data-v="100">100</button>
          </div>
          <p id="sheetRange" class="sheet-range">1〜999</p>
          <p id="sheetError" class="sheet-error" aria-live="assertive"></p>
        </div>
        <div class="keypad" aria-label="数字キー">
          <button type="button" class="key" data-k="1">1</button>
          <button type="button" class="key" data-k="2">2</button>
          <button type="button" class="key" data-k="3">3</button>
          <button type="button" class="key" data-k="4">4</button>
          <button type="button" class="key" data-k="5">5</button>
          <button type="button" class="key" data-k="6">6</button>
          <button type="button" class="key" data-k="7">7</button>
          <button type="button" class="key" data-k="8">8</button>
          <button type="button" class="key" data-k="9">9</button>
          <button type="button" class="key key-sub" data-k="C" aria-label="クリア">C</button>
          <button type="button" class="key" data-k="0">0</button>
          <button type="button" class="key key-sub" data-k="B" aria-label="1文字消す">⌫</button>
        </div>
        <div class="sheet-actions">
          <button id="sheetCancel" type="button" class="sheet-btn">キャンセル</button>
          <button id="sheetStart" type="button" class="sheet-btn primary">この番号で新しいゲーム</button>
        </div>
      </div>
      <div id="stepConfirm" hidden>
        <p id="confirmText" class="confirm-text"></p>
        <div class="sheet-actions">
          <button id="confirmNo" type="button" class="sheet-btn">やめる</button>
          <button id="confirmYes" type="button" class="sheet-btn danger">リセットして開始</button>
        </div>
      </div>
    </div>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-card">
      <div id="overlayTitle" class="overlay-title"></div>
      <div id="overlayBody" class="overlay-body"></div>
      <div class="overlay-actions">
        <button id="overlayBtn2" class="overlay-btn secondary" type="button" hidden></button>
        <button id="overlayBtn" class="overlay-btn" type="button"></button>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
